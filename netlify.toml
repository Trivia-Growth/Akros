[build]
  base    = "apps/web"
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.0.0"

# Sessão (ADR-0008) — cookie precisa ser first-party. Só estas 3 rotas passam por aqui;
# dado de negócio continua indo direto ao mock/PostgREST. Ordem importa: antes do catch-all de SPA.
[[redirects]]
  from   = "/api/sessao/*"
  to     = "https://mhxopadkizktsenohnbm.supabase.co/functions/v1/sessao-:splat"
  status = 200

# SPA: todas as rotas servem index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache longo para assets com hash de conteúdo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
