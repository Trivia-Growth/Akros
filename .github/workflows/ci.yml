# CI — três jobs de gate + o agregador `ci` (ADR-0016). Antes eram 13 jobs, cada um reinstalando
# dependências.
#
#   • ci         — agregador: o ÚNICO check obrigatório na `main`. Falha se qualquer job abaixo falhar.
#   • qualidade  — o que prova que o código está correto: Biome, typecheck, arquitetura, testes, build.
#   • seguranca  — o que impede regressão de segurança: segredo no histórico, migration sem RLS
#                  FORCE/GRANT, Edge Function pública sem rate limit.
#   • db-tests   — migrations aplicam do zero + testes SQL.
#
# Mantém o custo baixo com `concurrency` (push em sequência cancela o run anterior), `--affected`
# no turbo e cache do store do pnpm. O `e2e` (Playwright contra o Supabase real) NÃO roda aqui:
# autentica em produção e custaria minutos em todo PR; rode `pnpm e2e` antes de mexer em auth, RLS
# ou sessão.
#
# Regra: gate novo só entra com o teste do próprio gate e a saída de outro de custo equivalente
# (ver constituição, "Gates e fluxo").

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # `--affected` compara com o merge-base; precisa do histórico
      - uses: ./.github/actions/setup
      - name: Lint (Biome)
        run: pnpm exec biome check .
      - name: Typecheck
        run: pnpm exec turbo run typecheck --affected
      - name: Arquitetura (dependency-cruiser)
        run: pnpm run arch:check
      # `VITE_DEMO_MODE=true` reproduz o que `.env.test.local` faz na máquina do dev: os smoke de
      # render assumem modo demo. Sem isso a suíte quebra por ambiente, não por regressão.
      - name: Testes
        run: pnpm test
        env:
          VITE_DEMO_MODE: "true"
      - name: Build
        run: pnpm exec turbo run build --affected
      # Adaptadores de canal, pipeline do agente e handlers dos webhooks (fetch injetado, sem rede).
      # `DENO_NO_PACKAGE_JSON` impede o Deno de reescrever o package.json da raiz.
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Testes das Edge Functions (Deno)
        run: pnpm run test:functions

  seguranca:
    name: seguranca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # gitleaks varre o histórico do PR, não só o snapshot
      - uses: ./.github/actions/setup
      # Binário direto em vez da action do marketplace: a action pede licença para organização, e
      # um gate de segredo não pode depender de licenciamento para rodar.
      - name: Instalar gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      # Bloqueante aqui, ao contrário do pre-push local (ver SD-07 em docs/SECURITY_DEBT.md).
      - name: Segredos (gitleaks)
        run: gitleaks detect --source . --no-banner --redact --exit-code 1
      # RLS FORCE em toda tabela, CREATE POLICY com GRANT, Squawk (lock/breaking change).
      - name: Migrations (RLS + Squawk)
        run: pnpm run lint:migrations
      # Função pública sem `checarLimite`, função órfã, `functions.invoke` sem função declarada.
      - name: Edge Functions (rate limit e contrato)
        run: pnpm run check:edge-functions

  db-tests:
    name: db-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      # Prova que todas as migrations aplicam do zero, na ordem, sem erro — único lugar onde isso é
      # verificado (`lint:migrations` lê o SQL, não executa).
      # As migrations dependem de primitivas que o Supabase provisiona antes da primeira delas
      # (auth.uid(), auth.jwt(), auth.users e os roles anon/authenticated/service_role). O shim
      # declara exatamente essas — migration nova que use outra faz este job quebrar, que é o
      # comportamento certo.
      - name: Preparar ambiente Supabase mínimo
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/00-shim-supabase.sql

      - name: Aplicar migrations do zero
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for f in supabase/migrations/*.sql; do
            echo "── $f"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
          done
      # Testes de banco em SQL puro (`ASSERT` do plpgsql). Sem pgTAP de propósito: a extensão não
      # existe na imagem `postgres:17`. Com `ON_ERROR_STOP=1`, asserção falha derruba o job.
      - name: Testes de banco
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          if ! compgen -G "supabase/tests/*_test.sql" > /dev/null; then
            echo "::error::Nenhum teste de banco encontrado — o gate estaria passando sem avaliar nada."
            exit 1
          fi
          for f in supabase/tests/*_test.sql; do
            echo "── $f"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
          done

  # Único check obrigatório na proteção da `main`. Jobs acima podem ser criados, renomeados ou
  # removidos sem tocar na proteção de branch: basta manter este nome e o `needs` em dia.
  # `if: always()` faz o job rodar mesmo com falha upstream; sem isso ele seria "skipped", e
  # check pulado conta como verde para o GitHub.
  ci:
    name: ci
    if: always()
    needs: [qualidade, seguranca, db-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Todos os jobs precisam ter passado
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultados: $RESULTADOS"
          for r in $RESULTADOS; do
            [ "$r" = "success" ] || { echo "::error::job upstream terminou como '$r'"; exit 1; }
          done
