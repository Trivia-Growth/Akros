# Lefthook — orquestrador dos gates locais (ADR-0016).
#
# Filosofia: o ciclo local precisa ser rápido o bastante para ninguém querer pular. Por isso o
# pre-push roda só o que pega regressão de código em segundos (Biome, typecheck, vitest); a bateria
# de segurança e de arquitetura roda na CI, onde cancela run antigo e não custa tempo de quem está
# desenvolvendo. `pnpm run ci:local` = `lefthook run pre-push`: hook e comando manual são a MESMA
# definição.
#
# Fora daqui de propósito:
#   • e2e (Playwright, autentica no Supabase real) → `pnpm e2e`, sob demanda; obrigatório antes de
#     mexer em auth, RLS ou sessão.
#   • arch:check, lint:migrations, check:edge-functions, db-tests → CI (jobs `qualidade`,
#     `seguranca` e `db-tests`).

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true # re-staga o que o Biome corrigiu automaticamente

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1} # Conventional Commits, com ID da story no escopo

pre-push:
  parallel: true
  commands:
    lint:
      run: pnpm exec biome check .
    typecheck:
      run: pnpm run typecheck
    testes:
      run: pnpm test
    # Secret scanning é best-effort local (o gate bloqueante é o da CI); só roda se instalado:
    gitleaks:
      run: gitleaks detect --source . --no-banner --redact --exit-code 1
      skip:
        - run: "! command -v gitleaks"
